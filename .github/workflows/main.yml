name: CI

on:
  create:
  push:
    branches:
      - master
      - zig-0.16
    paths:
      - '**.zig'
  pull_request:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check *.zig

  test-in-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install qemu
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y qemu-user-binfmt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-${{ matrix.os }}-zig-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.os }}-zig-

      # Zig 0.16.0 writes zip downloads to <global cache>/tmp/<random>.zip
      # without creating tmp first (ziglang/zig#31964), so the fetch fails on
      # a cold cache. The mkdir below covers Linux and macOS, but this job's
      # default shell on Windows is PowerShell, where $ZIG_GLOBAL_CACHE_DIR is
      # unset and the path collapses to D:\tmp. Create it explicitly here.
      # Fixed upstream in 0.17.0, so this step only belongs on this branch.
      - name: Create Zig global cache tmp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $env:ZIG_GLOBAL_CACHE_DIR 'tmp') | Out-Null

      - name: Run Tests in memory
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          mkdir -p $ZIG_GLOBAL_CACHE_DIR/tmp
          zig build test -Dci=true -Din_memory=true --summary all -fqemu -fwine
      - name: Run Tests in memory
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        run: |
          mkdir -p $ZIG_GLOBAL_CACHE_DIR/tmp
          zig build test -Dci=true -Din_memory=true --summary all
