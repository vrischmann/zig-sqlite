name: 'Checkout Repository'
description: 'Checkout repository using git'
inputs:
  repository:
    description: 'Repository name with owner'
    required: false
    default: ''
  ref:
    description: 'Branch, tag, or SHA to checkout'
    required: false
    default: ''
  token:
    description: 'GitHub token for authentication'
    required: false
    default: ''
  fetch-depth:
    description: 'Number of commits to fetch'
    required: false
    default: '1'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        REF: ${{ inputs.ref }}
        FETCH_DEPTH: ${{ inputs.fetch-depth }}
      run: |
        set -euo pipefail
        
        # Use the default repository if not specified
        if [ -z "$REPOSITORY" ]; then
          REPOSITORY="${GITHUB_REPOSITORY}"
        fi
        
        # Use the default ref if not specified
        if [ -z "$REF" ]; then
          REF="${GITHUB_SHA}"
        fi
        
        # If we're already in the repo, just fetch and reset
        if [ -d ".git" ]; then
          echo "Repository already exists, fetching updates..."
          git fetch origin --depth="${FETCH_DEPTH}" 2>/dev/null || git fetch origin
          git reset --hard "$REF"
        else
          # Clone the repository
          CLONE_URL="https://github.com/${REPOSITORY}.git"
          if [ -n "$GITHUB_TOKEN" ]; then
            CLONE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          fi
          
          git clone --depth="${FETCH_DEPTH}" --branch="${GITHUB_REF_NAME}" "$CLONE_URL" .
          
          # If we cloned with a branch name but need a specific SHA, reset to it
          if [ "$REF" != "${GITHUB_REF_NAME}" ] && [ "$REF" != "${GITHUB_SHA}" ]; then
            git fetch origin "$REF" --depth=1
            git reset --hard "$REF"
          fi
        fi
        
        # Verify checkout
        echo "Checked out $(git rev-parse HEAD)"
        git log -1 --oneline